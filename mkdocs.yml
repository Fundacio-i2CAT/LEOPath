site_name: LEOPath
site_url: https://fundacio-i2cat.github.io/LEOPath/
repo_url: https://github.com/Fundacio-i2CAT/LEOPath
repo_name: Fundacio-i2CAT/LEOPath
docs_dir: docs
site_dir: site

theme:
  variant: modern
  logo: assets/brand/leopath-mark.png
  favicon: assets/brand/favicon.png
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: quickstart.md
  - Configuration: configuration.md
  - Algorithms: algorithms.md
  - Ground-Station Addresses: ground-stations.md
  - ISL Topology: isl-topology.md
  - Evaluation: evaluation.md
  - Visualizations: visualizations.md
  - Experiments: experiments.md
  - Architecture: architecture.md
  - Contributing: contributing.md
  - FAQ: faq.md
  - License: license.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - toc:
      permalink: true
