constellation:
  name: "Starlink-550"
  num_orbits: 72  # FCC 21-48 para 4: 72 planes x 22 satellites at 550 km, 53 deg
  num_sats_per_orbit: 22
  phase_diff: true
  inclination_degree: 53
  eccentricity: 0.0000001
  arg_of_perigee_degree: 0.0
  mean_motion_rev_per_day: 15.05  # flies 550 km under SGP4; Hypatia's 15.19 flies ~508 km
  tle_output_filename: "tles_starlink_550_sgp.txt"

simulation:
  dynamic_state_algorithm: shortest_path_link_state
  algorithm_params:
    segment_count: 2
    plane_weight: 100.0
    sat_weight: 1.0
    shell_weight: 1000.0
  output_dir: null # Set to a path or keep null
  end_time_hours: 24
  time_step_minutes: 10
  offset_ns: 0

satellite:
  altitude_m: 550000
  cone_angle_degrees: 25.0

earth:
  radius_m: 6378135.0
  isl_min_altitude_m: 80000

ground_stations:
  - name: "London"
    latitude: 51.5074
    longitude: -0.1278
    elevation_m: 30.0
  - name: "Perth"
    latitude: -31.9505
    longitude: 115.8605
    elevation_m: 30.0

network:
  gsl_interfaces:
    number_of_interfaces: 1
    aggregate_max_bandwidth: 1.0

logging:
  is_debug: false
  file_name: "simulation.log"
