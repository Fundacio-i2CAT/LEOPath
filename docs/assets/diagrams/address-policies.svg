<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 440' width='720' height='440' font-family='Inter, Helvetica, Arial, sans-serif' role='img'><title>Address policies</title><defs><marker id='a-ink' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='13' markerHeight='13' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#222222'/></marker><marker id='a-green' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='13' markerHeight='13' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#009E73'/></marker><marker id='a-red' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='13' markerHeight='13' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#D55E00'/></marker><marker id='a-blue' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='13' markerHeight='13' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#0072B2'/></marker><marker id='a-orange' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='13' markerHeight='13' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#E69F00'/></marker><marker id='a-pink' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='13' markerHeight='13' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#CC79A7'/></marker><marker id='a-grey' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='13' markerHeight='13' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#8a8a8a'/></marker></defs><rect x='0.5' y='0.5' width='719.0' height='439.0' rx='12' fill='#ffffff' stroke='#d9d9d9' stroke-width='1.5'/><text x='360.0' y='30.0' font-size='16' fill='#222222' text-anchor='middle' font-weight='bold'>Which of B's addresses a flow uses</text><rect x='16.0' y='62.0' width='688.0' height='80.0' rx='8' fill='#ffffff' stroke='#d9d9d9' stroke-width='1.5'/><text x='30.0' y='84.0' font-size='13' fill='#222222' text-anchor='start' font-weight='bold'>nearest</text><text x='230.0' y='84.0' font-size='11' fill='#8a8a8a' text-anchor='start' font-weight='normal'>B's address follows its nearest satellite;</text><text x='230.0' y='100.0' font-size='11' fill='#8a8a8a' text-anchor='start' font-weight='normal'>every caller uses it</text><text x='30.0' y='104.0' font-size='11' fill='#009E73' text-anchor='start' font-weight='normal'>who chooses: B</text><path d='M630.0,122.0 L640.0,106.0 L650.0,122.0 Z' fill='#ffffff' stroke='#222222' stroke-width='1.8'/><circle cx='640.0' cy='104.0' r='3.5' fill='#222222' stroke='#222222' stroke-width='1'/><text x='640.0' y='82.0' font-size='12' fill='#222222' text-anchor='middle' font-weight='bold'>B</text><polygon points='610.0,81.0 603.0,92.9 617.0,92.9' fill='#0072B2' stroke='#222222' stroke-width='1'/><polygon points='670.0,95.0 663.0,83.1 677.0,83.1' fill='#E69F00' stroke='#222222' stroke-width='1'/><text x='518.0' y='92.0' font-size='11' fill='#0072B2' text-anchor='end' font-weight='normal'>A1 (north half)</text><path d='M530.0,88.0 L602.0,90.0' fill='none' stroke='#0072B2' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' opacity='0.9' marker-end='url(#a-blue)'/><text x='518.0' y='122.0' font-size='11' fill='#E69F00' text-anchor='end' font-weight='normal'>A2 (south half)</text><path d='M530.0,118.0 L602.0,90.0' fill='none' stroke='#0072B2' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' opacity='0.9' marker-end='url(#a-blue)'/><rect x='16.0' y='154.0' width='688.0' height='80.0' rx='8' fill='#ffffff' stroke='#d9d9d9' stroke-width='1.5'/><text x='30.0' y='176.0' font-size='13' fill='#222222' text-anchor='start' font-weight='bold'>sticky_nearest (default)</text><text x='230.0' y='176.0' font-size='11' fill='#8a8a8a' text-anchor='start' font-weight='normal'>B keeps its current address while it's</text><text x='230.0' y='192.0' font-size='11' fill='#8a8a8a' text-anchor='start' font-weight='normal'>still attached; every caller uses it</text><text x='30.0' y='196.0' font-size='11' fill='#009E73' text-anchor='start' font-weight='normal'>who chooses: B</text><path d='M630.0,214.0 L640.0,198.0 L650.0,214.0 Z' fill='#ffffff' stroke='#222222' stroke-width='1.8'/><circle cx='640.0' cy='196.0' r='3.5' fill='#222222' stroke='#222222' stroke-width='1'/><text x='640.0' y='174.0' font-size='12' fill='#222222' text-anchor='middle' font-weight='bold'>B</text><polygon points='610.0,173.0 603.0,184.9 617.0,184.9' fill='#0072B2' stroke='#222222' stroke-width='1'/><polygon points='670.0,187.0 663.0,175.1 677.0,175.1' fill='#E69F00' stroke='#222222' stroke-width='1'/><text x='518.0' y='184.0' font-size='11' fill='#0072B2' text-anchor='end' font-weight='normal'>A1 (north half)</text><path d='M530.0,180.0 L602.0,182.0' fill='none' stroke='#0072B2' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' opacity='0.9' marker-end='url(#a-blue)'/><text x='518.0' y='214.0' font-size='11' fill='#E69F00' text-anchor='end' font-weight='normal'>A2 (south half)</text><path d='M530.0,210.0 L602.0,182.0' fill='none' stroke='#0072B2' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' opacity='0.9' marker-end='url(#a-blue)'/><rect x='16.0' y='246.0' width='688.0' height='80.0' rx='8' fill='#ffffff' stroke='#d9d9d9' stroke-width='1.5'/><text x='30.0' y='268.0' font-size='13' fill='#222222' text-anchor='start' font-weight='bold'>requester_aware</text><text x='230.0' y='268.0' font-size='11' fill='#8a8a8a' text-anchor='start' font-weight='normal'>B answers each caller with its address</text><text x='230.0' y='284.0' font-size='11' fill='#8a8a8a' text-anchor='start' font-weight='normal'>on that caller's half</text><text x='30.0' y='288.0' font-size='11' fill='#009E73' text-anchor='start' font-weight='normal'>who chooses: B</text><path d='M630.0,306.0 L640.0,290.0 L650.0,306.0 Z' fill='#ffffff' stroke='#222222' stroke-width='1.8'/><circle cx='640.0' cy='288.0' r='3.5' fill='#222222' stroke='#222222' stroke-width='1'/><text x='640.0' y='266.0' font-size='12' fill='#222222' text-anchor='middle' font-weight='bold'>B</text><polygon points='610.0,265.0 603.0,276.9 617.0,276.9' fill='#0072B2' stroke='#222222' stroke-width='1'/><polygon points='670.0,279.0 663.0,267.1 677.0,267.1' fill='#E69F00' stroke='#222222' stroke-width='1'/><text x='518.0' y='276.0' font-size='11' fill='#0072B2' text-anchor='end' font-weight='normal'>A1 (north half)</text><path d='M530.0,272.0 L602.0,274.0' fill='none' stroke='#0072B2' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' opacity='0.9' marker-end='url(#a-blue)'/><text x='518.0' y='306.0' font-size='11' fill='#E69F00' text-anchor='end' font-weight='normal'>A2 (south half)</text><path d='M530.0,302.0 L678.0,274.0' fill='none' stroke='#E69F00' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' opacity='0.9' marker-end='url(#a-orange)'/><rect x='16.0' y='338.0' width='688.0' height='80.0' rx='8' fill='#ffffff' stroke='#d9d9d9' stroke-width='1.5'/><text x='30.0' y='360.0' font-size='13' fill='#222222' text-anchor='start' font-weight='bold'>per_flow_pair</text><text x='230.0' y='360.0' font-size='11' fill='#8a8a8a' text-anchor='start' font-weight='normal'>each source picks both ends for its flow</text><text x='230.0' y='376.0' font-size='11' fill='#8a8a8a' text-anchor='start' font-weight='normal'>(beyond 6G-RUPA, kept as a bound)</text><text x='30.0' y='380.0' font-size='11' fill='#CC79A7' text-anchor='start' font-weight='normal'>who chooses: source</text><path d='M630.0,398.0 L640.0,382.0 L650.0,398.0 Z' fill='#ffffff' stroke='#222222' stroke-width='1.8'/><circle cx='640.0' cy='380.0' r='3.5' fill='#222222' stroke='#222222' stroke-width='1'/><text x='640.0' y='358.0' font-size='12' fill='#222222' text-anchor='middle' font-weight='bold'>B</text><polygon points='610.0,357.0 603.0,368.9 617.0,368.9' fill='#0072B2' stroke='#222222' stroke-width='1'/><polygon points='6