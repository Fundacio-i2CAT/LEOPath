<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 378' width='720' height='378' font-family='Inter, Helvetica, Arial, sans-serif' role='img'><title>Smart directory</title><defs><marker id='a-ink' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='13' markerHeight='13' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#222222'/></marker><marker id='a-green' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='13' markerHeight='13' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#009E73'/></marker><marker id='a-red' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='13' markerHeight='13' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#D55E00'/></marker><marker id='a-blue' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='13' markerHeight='13' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#0072B2'/></marker><marker id='a-orange' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='13' markerHeight='13' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#E69F00'/></marker><marker id='a-pink' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='13' markerHeight='13' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#CC79A7'/></marker><marker id='a-grey' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='13' markerHeight='13' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#8a8a8a'/></marker></defs><style>.f{opacity:0;animation:show 12.0s infinite}@keyframes show{0%{opacity:1}24.50%{opacity:1}25.00%{opacity:0}100%{opacity:0}}.f0{animation-delay:0.0s}.f1{animation-delay:3.0s}.f2{animation-delay:6.0s}.f3{animation-delay:9.0s}@media (prefers-reduced-motion: reduce){.f{animation:none}.f3{opacity:1}}</style><rect x='0.5' y='0.5' width='719.0' height='377.0' rx='12' fill='#ffffff' stroke='#d9d9d9' stroke-width='1.5'/><text x='360.0' y='30.0' font-size='16' fill='#222222' text-anchor='middle' font-weight='bold'>Smart directory: B answers with the address that suits A</text><rect x='20.0' y='48.0' width='140.0' height='30.0' rx='6' fill='#ffffff' stroke='#d9d9d9' stroke-width='1.5'/><text x='90.0' y='68.0' font-size='12' fill='#222222' text-anchor='middle' font-weight='bold'>A</text><line x1='90.0' y1='80.0' x2='90.0' y2='330.0' stroke='#d9d9d9' stroke-width='1.5' stroke-linecap='round' opacity='1.0' stroke-dasharray='4 5'/><rect x='180.0' y='48.0' width='140.0' height='30.0' rx='6' fill='#ffffff' stroke='#d9d9d9' stroke-width='1.5'/><text x='250.0' y='68.0' font-size='12' fill='#222222' text-anchor='middle' font-weight='bold'>A's satellites</text><line x1='250.0' y1='80.0' x2='250.0' y2='330.0' stroke='#d9d9d9' stroke-width='1.5' stroke-linecap='round' opacity='1.0' stroke-dasharray='4 5'/><rect x='400.0' y='48.0' width='140.0' height='30.0' rx='6' fill='#ffffff' stroke='#d9d9d9' stroke-width='1.5'/><text x='470.0' y='68.0' font-size='12' fill='#222222' text-anchor='middle' font-weight='bold'>B's IPCP / directory</text><line x1='470.0' y1='80.0' x2='470.0' y2='330.0' stroke='#d9d9d9' stroke-width='1.5' stroke-linecap='round' opacity='1.0' stroke-dasharray='4 5'/><rect x='560.0' y='48.0' width='140.0' height='30.0' rx='6' fill='#ffffff' stroke='#d9d9d9' stroke-width='1.5'/><text x='630.0' y='68.0' font-size='12' fill='#222222' text-anchor='middle' font-weight='bold'>B</text><line x1='630.0' y1='80.0' x2='630.0' y2='330.0' stroke='#d9d9d9' stroke-width='1.5' stroke-linecap='round' opacity='1.0' stroke-dasharray='4 5'/><g class='f f0'><path d='M90.0,115.0 L462.0,115.0' fill='none' stroke='#222222' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' opacity='0.9' marker-end='url(#a-ink)'/><text x='280.0' y='107.0' font-size='12' fill='#222222' text-anchor='middle' font-weight='bold'>allocate flow to B  (from A's north address)</text><text x='360.0' y='358.0' font-size='12' fill='#8a8a8a' text-anchor='middle' font-weight='normal'>the request carries the caller's address, so B can see which half A is on</text></g><g class='f f1'><path d='M90.0,115.0 L462.0,115.0' fill='none' stroke='#8a8a8a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' opacity='0.9' marker-end='url(#a-ink)'/><text x='280.0' y='107.0' font-size='11' fill='#8a8a8a' text-anchor='middle' font-weight='normal'>allocate flow to B  (from A's north address)</text><path d='M470.0,165.0 L98.0,165.0' fill='none' stroke='#009E73' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' opacity='0.9' marker-end='url(#a-green)'/><text x='280.0' y='157.0' font-size='12' fill='#009E73' text-anchor='middle' font-weight='bold'>use B's north address (0, 28, 0, x)</text><text x='360.0' y='358.0' font-size='12' fill='#8a8a8a' text-anchor='middle' font-weight='normal'>B holds one address per half and returns the one on A's half</text></g><g class='f f2'><path d='M90.0,115.0 L462.0,115.0' fill='none' stroke='#8a8a8a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' opacity='0.9' marker-end='url(#a-ink)'/><text x='280.0' y='107.0' font-size='11' fill='#8a8a8a' text-anchor='middle' font-weight='normal'>allocate flow to B  (from A's north address)</text><path d='M470.0,165.0 L98.0,165.0' fill='none' stroke='#8a8a8a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' opacity='0.9' marker-end='url(#a-ink)'/><text x='280.0' y='157.0' font-size='11' fill='#8a8a8a' text-anchor='middle' font-weight='normal'>use B's north address (0, 28, 0, x)</text><path d='M90.0,215.0 L242.0,215.0' fill='none' stroke='#0072B2' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' opacity='0.9' marker-end='url(#a-blue)'/><text x='170.0' y='207.0' font-size='12' fill='#0072B2' text-anchor='middle' font-weight='bold'>send via A's north satellite</text><text x='360.0' y='358.0' font-size='12' fill='#8a8a8a' text-anchor='middle' font-weight='normal'>A uplinks through whichever of its own satellites suits that address</text></g><g class='f f3'><path d='M90.0,115.0 L462.0,115.0' fill='none' stroke='#8a8a8a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' opacity='0.9' marker-end='url(#a-ink)'/><text x='280.0' y='107.0' font-size='11' fill='#8a8a8a' text-anchor='middle' font-weight='normal'>allocate flow to B  (from A's north address)</text><path d='M470.0,165.0 L98.0,165.0' fill='none' stroke='#8a8a8a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' opacity='0.9' marker-end='url(#a-ink)'/><text x='280.0' y='157.0' font-size='11' fill='#8a8a8a' text-anchor='middle' font-weight='normal'>use B's north address (0, 28, 0, x)</text><path d='M90.0,215.0 L242.0,215.0' fill='none' stroke='#8a8a8a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' opacity='0.9' marker-end='url(#a-ink)'/><text x='170.0' y='207.0' font-size='11' fill='#8a8a8a' text-anchor='middle' font-weight='normal'>send via A's north satellite</text><path d='M250.0,265.0 L622.0,265.0' fill='none' stroke='#009E73' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' opacity='0.9' marker-end='url(#a-green)'/><text x='440.0' y='257.0' font-size='12' fill='#009E73' text-anchor='middle' font-weight='bold'>data: stays on the north half, ~23 ms not ~178</text><text x='360.0' y='358.0' font-size='12' fill='#8a8a8a' text-anchor='middle' font-weight='normal'>the flow keeps B's address until B's next renumbering</text></g></svg>